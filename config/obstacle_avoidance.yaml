/**:
  ros__parameters:
    # --------------------------------------------------------------------------
    # Public baseline parameters
    # --------------------------------------------------------------------------

    obstacle_avoidance.enabled: true

    # Object detection
    obstacle_avoidance.max_object_ahead: 300.0
    # fix(oa) branch: only genuinely static objects trigger a lateral avoidance.
    # The rosbags show parked cars report exactly 0 velocity and pedestrians
    # ~1-2 m/s, so 0.1 (reserve for perception not reporting exactly 0) cleanly
    # keeps pedestrians out of the shift -- they are braked for, not swerved around.
    obstacle_avoidance.max_static_object_speed: 0.1

    # Speed hysteresis before an already-avoided obstacle stops being ignored
    obstacle_avoidance.ignored_obstacle_release_speed: 1.5

    # Ego-route relevance corridor
    obstacle_avoidance.ego_corridor_safety_margin: 0.5

    # Real lateral object clearance
    obstacle_avoidance.side_clearance: 1.0

    # Longitudinal maneuver geometry. front_clearance is the MAX entry ramp; the
    # effective ramp is sized down to the available distance to a late obstacle.
    obstacle_avoidance.front_clearance: 7.0
    obstacle_avoidance.rear_clearance: 7.0
    obstacle_avoidance.stop_before_obstacle: 8.0

    # Mode switches
    obstacle_avoidance.in_lane_shift_enabled: true
    obstacle_avoidance.adjacent_lane_enabled: false
    obstacle_avoidance.opposite_lane_enabled: false

    # Drivable area / route behavior
    obstacle_avoidance.enforce_drivable_area: true
    # Upper speed cap during avoidance; the maneuver speed is sized down from this
    # so the lateral shift stays within avoidance_lateral_accel over the entry ramp
    # (v = ramp*sqrt(a/(6*D))). Raise to let small shifts drive faster.
    obstacle_avoidance.max_speed_during_avoidance: 4.167
    # Comfort lateral acceleration coupling maneuver speed and ramp length.
    obstacle_avoidance.avoidance_lateral_accel: 2.0
    # Creep floor for the sized avoidance speed (m/s).
    obstacle_avoidance.min_avoidance_speed: 0.833 

    # Distance ahead of the lateral-shift start at which the turn indicator
    # switches on (the blinker stays off while the maneuver is only decided).
    obstacle_avoidance.blinker_lead_distance: 25.0

    # Candidate generation
    obstacle_avoidance.validate_shifted_trajectory: true

    # Active route monitor
    obstacle_avoidance.modified_route_safety_check_enabled: true
    obstacle_avoidance.modified_route_max_check_distance: 30.0
    obstacle_avoidance.modified_route_time_horizon: 12.0

    # --------------------------------------------------------------------------
    # Internal/advanced parameters
    # --------------------------------------------------------------------------

    # Plausibility filter for bad route projections / unrelated objects
    obstacle_avoidance.max_object_lateral_distance: 8.0

    obstacle_avoidance.min_object_ahead: 0.5
    obstacle_avoidance.min_oncoming_heading_diff: 2.35

    # If left and right are equally good, prefer left (right-hand traffic overtaking)
    obstacle_avoidance.prefer_left_shift: true

    # Longitudinal tolerance for neighbouring lane availability
    obstacle_avoidance.lane_s_overlap_slack: 0.50

    # Lateral tolerance for joining adjacent lane-border intervals
    obstacle_avoidance.lane_boundary_join_slack: 0.25

    obstacle_avoidance.max_projection_distance_from_route: 5.0

    # --------------------------------------------------------------------------
    # Oncoming traffic gap-acceptance parameters
    # --------------------------------------------------------------------------

    # Minimum time margin before an oncoming vehicle arrives at conflict area
    obstacle_avoidance.oncoming_time_margin: 1.0

    # Brake on the currently driven modified route even when a conflicting
    # oncoming vehicle is first detected after ego has committed to the
    # opposite-lane maneuver.
    obstacle_avoidance.stop_for_oncoming_after_commitment: true

    # Minimum speed for ego vehicle when computing clear time
    obstacle_avoidance.min_ego_speed_for_gap_check: 1.0

    # Minimum speed used when computing oncoming arrival time
    obstacle_avoidance.min_oncoming_speed_for_gap_check: 1.0

    # Minimum route-aligned speed for oncoming participant
    obstacle_avoidance.min_oncoming_route_speed: 1.0

    # Participant retention distance for the prediction horizon
    obstacle_avoidance.max_expected_participant_speed: 20.0

    # Time horizon for predicting participant trajectories
    obstacle_avoidance.prediction_time_horizon: 15.0

    # Safety distances during oncoming conflict
    obstacle_avoidance.oncoming_safety_distance_front: 2.0
    obstacle_avoidance.oncoming_safety_distance_rear: 2.0

    # Bridge short tracker dropouts while waiting for oncoming traffic
    obstacle_avoidance.oncoming_detection_hold_time: 0.75

    # --------------------------------------------------------------------------
    # Ego-lane oncoming stop behavior
    # --------------------------------------------------------------------------

    # Enable defensive stop for oncoming participants in ego lane
    obstacle_avoidance.ego_lane_oncoming_stop_enabled: false

    # Maximum longitudinal distance ahead of ego for oncoming participant
    obstacle_avoidance.ego_lane_oncoming_max_distance: 80.0

    # Maximum time-to-conflict for triggering defensive stop
    obstacle_avoidance.ego_lane_oncoming_time_horizon: 15.0

    # Required route-aligned speed against ego route direction
    obstacle_avoidance.ego_lane_oncoming_min_route_speed: 1.0

    # Additional lateral tolerance around current ego lane
    obstacle_avoidance.ego_lane_oncoming_lateral_margin: 0.20

    # Desired distance between ego front and nearest footprint point of oncoming participant
    obstacle_avoidance.ego_lane_oncoming_stop_distance: 15.0

    # --------------------------------------------------------------------------
    # Active modified-route safety monitor parameters
    # --------------------------------------------------------------------------

    obstacle_avoidance.modified_route_ttc_margin: 2.0
    obstacle_avoidance.modified_route_stop_ttc_threshold: 5.0
    obstacle_avoidance.modified_route_braking_safety_margin: 5.0
    obstacle_avoidance.min_valid_stop_margin: 1.0

    # --------------------------------------------------------------------------
    # Trajectory, geometry, and scoring parameters
    # --------------------------------------------------------------------------

    obstacle_avoidance.min_vehicle_dimension: 0.1
    obstacle_avoidance.route_window_min: 20.0
    obstacle_avoidance.min_motion_speed: 0.05
    # Nominal positive deceleration used for planned OA speed/stop profiles.
    # Keep below abs(vehicle acceleration_min) to leave reserve for max braking.
    obstacle_avoidance.planned_braking_deceleration: 1.0
    # Lower bound for braking deceleration in stop-distance calculations.
    obstacle_avoidance.min_braking_deceleration: 0.5
    obstacle_avoidance.stop_adjustment_offset: 1.0
    obstacle_avoidance.lateral_shift_penalty_score: 20.0
    obstacle_avoidance.opposite_lane_penalty_score: 40.0
