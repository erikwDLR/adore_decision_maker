/**:
  ros__parameters:
    # --------------------------------------------------------------------------
    # Public baseline parameters
    # --------------------------------------------------------------------------

    # Master switch for obstacle avoidance, including its defensive stop logic.
    obstacle_avoidance.enabled: true

    # Maximum measured object speed [m/s] still classified as static.
    obstacle_avoidance.max_static_object_speed: 0.1

    # Hard minimum edge-to-edge clearance [m] for intrusion detection and
    # trajectory validation.
    obstacle_avoidance.ego_corridor_safety_margin: 0.5

    # Desired edge-to-edge lateral clearance [m] used to size the route shift.
    obstacle_avoidance.side_clearance: 1.0

    # Allowed shortfall [m] from side_clearance before another optional
    # best-effort replan is requested. Does not change either safety distance.
    obstacle_avoidance.side_clearance_replan_tolerance: 0.03

    # Maximum shift-in ramp length [m] before ego is fully alongside an object.
    obstacle_avoidance.front_clearance: 7.0

    # Shift-out ramp length [m] after the ego footprint has cleared an object.
    obstacle_avoidance.rear_clearance: 7.0

    # Desired longitudinal gap [m] from ego front to a blocking object when stopped.
    obstacle_avoidance.stop_before_obstacle: 8.0

    # Allow an avoidance shift that remains inside the current driving lane.
    obstacle_avoidance.in_lane_shift_enabled: true

    # Allow an avoidance shift into connected same-direction driving lanes.
    obstacle_avoidance.adjacent_lane_enabled: true

    # Allow an avoidance shift into an opposite-direction driving lane.
    obstacle_avoidance.opposite_lane_enabled: true

    # Upper avoidance-speed limit [m/s]; 0 disables this additional speed cap.
    obstacle_avoidance.max_speed_during_avoidance: 4.167

    # Lateral comfort acceleration [m/s^2] used to size speed from shift and ramp.
    obstacle_avoidance.avoidance_lateral_accel: 2.0

    # Distance [m] before shift start at which the turn indicator is requested.
    obstacle_avoidance.blinker_lead_distance: 25.0

    # Shared future-prediction horizon [s] for dynamic and oncoming conflicts.
    obstacle_avoidance.prediction_time_horizon: 15.0

    # --------------------------------------------------------------------------
    # Internal/advanced parameters
    # --------------------------------------------------------------------------

    # Minimum heading difference [rad] used as evidence of opposite orientation.
    obstacle_avoidance.min_oncoming_heading_diff: 2.35

    # Prefer a left shift when mode and required shift magnitude are otherwise tied.
    obstacle_avoidance.prefer_left_shift: true

    # Longitudinal map tolerance [m] when checking whether a lane covers route s.
    obstacle_avoidance.lane_s_overlap_slack: 0.50

    # Maximum lateral map gap [m] still merged into one connected drivable area.
    obstacle_avoidance.lane_boundary_join_slack: 0.25

    # --------------------------------------------------------------------------
    # Oncoming traffic gap-acceptance parameters
    # --------------------------------------------------------------------------

    # Required time reserve [s] after ego clears before oncoming traffic arrives.
    obstacle_avoidance.oncoming_time_margin: 1.0

    # Minimum opposite route-aligned speed [m/s] for moving-oncoming classification.
    obstacle_avoidance.min_oncoming_route_speed: 1.0

    # Longitudinal reserve [m] around ego's opposite-lane occupancy interval.
    obstacle_avoidance.oncoming_spatial_margin: 2.0

    # --------------------------------------------------------------------------
    # Ego-lane oncoming stop behavior
    # --------------------------------------------------------------------------

    # Additional lateral tolerance [m] when deciding ego-lane overlap.
    obstacle_avoidance.ego_lane_oncoming_lateral_margin: 0.20

    # Desired stopping gap [m] from ego front to an oncoming ego-lane participant.
    obstacle_avoidance.ego_lane_oncoming_stop_distance: 8.0

    # --------------------------------------------------------------------------
    # Active modified-route safety monitor parameters
    # --------------------------------------------------------------------------

    # Extra distance [m] added before the calculated active-route brake start.
    obstacle_avoidance.modified_route_braking_safety_margin: 2.0

    # --------------------------------------------------------------------------
    # Trajectory and geometry parameters
    # --------------------------------------------------------------------------

    # Minimum local route-s search window [m] used for route projections.
    obstacle_avoidance.route_window_min: 20.0

    # Extra unexplained forward projection progress [m] tolerated beyond odometry.
    obstacle_avoidance.projection_progress_tolerance: 2.0

    # Speed threshold [m/s] below which a trajectory state counts as stopped.
    obstacle_avoidance.stopped_ego_speed: 0.20

    # Nominal positive deceleration [m/s^2] for planned OA braking profiles.
    obstacle_avoidance.planned_braking_deceleration: 1.0
