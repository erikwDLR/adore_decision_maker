/**:
  ros__parameters:
    obstacle_avoidance.enabled: true

    # Object detection
    obstacle_avoidance.max_object_ahead: 50.0
    obstacle_avoidance.max_static_object_speed: 0.5

    # Ego-route relevance corridor
    obstacle_avoidance.ego_corridor_safety_margin: 0.2

    # Real lateral object clearance
    obstacle_avoidance.side_clearance: 0.4

    # Longitudinal maneuver geometry
    obstacle_avoidance.front_clearance: 6.0
    obstacle_avoidance.rear_clearance: 6.0
    obstacle_avoidance.stop_before_obstacle: 10.0

    # Mode switches
    obstacle_avoidance.in_lane_shift_enabled: true
    obstacle_avoidance.adjacent_lane_enabled: true
    obstacle_avoidance.opposite_lane_enabled: true #false
    obstacle_avoidance.clustering_enabled: true

    # Drivable area / route behavior
    obstacle_avoidance.enforce_drivable_area: true
    obstacle_avoidance.max_speed_during_avoidance: 2.78 # 10 km/h

    # Candidate generation
    obstacle_avoidance.validate_shifted_trajectory: true
    obstacle_avoidance.lateral_candidate_extra_steps: 2
    obstacle_avoidance.lateral_candidate_extra_step: 0.30

    # Active route monitor
    obstacle_avoidance.modified_route_safety_check_enabled: true
    obstacle_avoidance.modified_route_max_check_distance: 50.0
    obstacle_avoidance.modified_route_time_horizon: 12.0
    obstacle_avoidance.stop_on_modified_route_conflict: true
